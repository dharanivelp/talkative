name: talkative

services:
  talkative:
    image: talkative:latest
    container_name: talkative
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://talkative.space}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      USER_DATABASE_PATH: /data/users.db
      ADMIN_DATABASE_PATH: /data/admin.db
      DATABASE_PATH: /data/talkative.db
      STATE_DATABASE_PATH: /data/state.db
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_TRANSCRIPT_KEY: ${ADMIN_TRANSCRIPT_KEY:-}
      COMPANY_COST_PER_DAY: ${COMPANY_COST_PER_DAY:-0}
      COMPANY_COST_CURRENCY: ${COMPANY_COST_CURRENCY:-INR}
      ACTIVITY_LOG_RETENTION_DAYS: ${ACTIVITY_LOG_RETENTION_DAYS:-30}
    volumes:
      - chat-data:/data
volumes:
  chat-data:
    name: talkative_chat-data
